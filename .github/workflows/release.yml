name: Verify or publish native release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Dotted plugin version without the v prefix
        required: true
        default: 0.1.6
        type: string
      mode:
        description: Verify artifacts or publish the GitHub Release
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            cpa_schema2_asset: CLIProxyAPI_7.2.103_linux_amd64.tar.gz
            cpa_schema3_asset: CLIProxyAPI_7.2.129_linux_amd64.tar.gz
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            cpa_schema2_asset: CLIProxyAPI_7.2.103_linux_aarch64.tar.gz
            cpa_schema3_asset: CLIProxyAPI_7.2.129_linux_aarch64.tar.gz
          - goos: darwin
            goarch: arm64
            runner: macos-15
            cpa_schema2_asset: CLIProxyAPI_7.2.103_darwin_aarch64.tar.gz
            cpa_schema3_asset: CLIProxyAPI_7.2.129_darwin_aarch64.tar.gz
          - goos: windows
            goarch: amd64
            runner: windows-2025
            cpa_schema2_asset: CLIProxyAPI_7.2.103_windows_amd64.zip
            cpa_schema3_asset: CLIProxyAPI_7.2.129_windows_amd64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "1"
      CPA_SCHEMA2_VERSION: v7.2.103
      CPA_SCHEMA3_VERSION: v7.2.129
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.4
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Expose MinGW toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\mingw64\bin'

      - name: Validate version and source consistency
        shell: bash
        run: |
          python scripts/release.py validate-version "${VERSION}"
          python -c 'import os, pathlib, re, sys; text=pathlib.Path("Makefile").read_text(); match=re.search(r"^VERSION \?= (\S+)$", text, re.M); sys.exit(0 if match and match.group(1) == os.environ["VERSION"] else "workflow version does not match Makefile")'

      - name: Run Windows-native credential replacement regressions
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go test ./internal/pat -count=1 \
            -run '^(TestReplaceFile0600ReplacesSymlinkWithoutFollowingIt|TestReplaceFile0600ReplacesRegularFile|TestGitHubActionsRequiresWindowsSymlinkTest)$'

      - name: Build Linux release library in manylinux2014
        if: runner.os == 'Linux'
        shell: bash
        run: |
          OUTPUT="dist/codex-pat-v${VERSION}.so" GOARCH="${GOARCH}" VERSION="${VERSION}" bash scripts/build-manylinux.sh

      - name: Build macOS release library
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -buildmode=c-shared -ldflags "-s -w -X main.version=${VERSION}" -o "dist/codex-pat-v${VERSION}.dylib" ./cmd/codex-pat
          chmod 0755 "dist/codex-pat-v${VERSION}.dylib"

      - name: Build Windows release library
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -buildmode=c-shared -ldflags "-s -w -X main.version=${VERSION}" -o dist/codex_pat.dll ./cmd/codex-pat
          mv dist/codex_pat.dll "dist/codex-pat-v${VERSION}.dll"

      - name: Inspect native library
        shell: bash
        run: |
          case "${GOOS}" in
            linux) extension=.so; glibc=(--glibc-max 2.17) ;;
            darwin) extension=.dylib; glibc=() ;;
            windows) extension=.dll; glibc=() ;;
          esac
          python scripts/release.py verify-library \
            --library "dist/codex-pat-v${VERSION}${extension}" \
            --goos "${GOOS}" --goarch "${GOARCH}" "${glibc[@]}"

      - name: Download and unpack schema-v2 and schema-v3 CPA releases
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CPA_SCHEMA2_ASSET: ${{ matrix.cpa_schema2_asset }}
          CPA_SCHEMA3_ASSET: ${{ matrix.cpa_schema3_asset }}
        run: |
          mkdir -p cpa-schema2 cpa-schema3
          gh release download "${CPA_SCHEMA2_VERSION}" --repo router-for-me/CLIProxyAPI --pattern "${CPA_SCHEMA2_ASSET}" --dir cpa-schema2
          gh release download "${CPA_SCHEMA3_VERSION}" --repo router-for-me/CLIProxyAPI --pattern "${CPA_SCHEMA3_ASSET}" --dir cpa-schema3
          tar -xzf "cpa-schema2/${CPA_SCHEMA2_ASSET}" -C cpa-schema2
          tar -xzf "cpa-schema3/${CPA_SCHEMA3_ASSET}" -C cpa-schema3
          cpa_schema2_bin="$(find cpa-schema2 -type f -name cli-proxy-api -print -quit)"
          cpa_schema3_bin="$(find cpa-schema3 -type f -name cli-proxy-api -print -quit)"
          test -n "${cpa_schema2_bin}"
          test -n "${cpa_schema3_bin}"
          chmod 0755 "${cpa_schema2_bin}" "${cpa_schema3_bin}"
          echo "CPA_SCHEMA2_BIN=${PWD}/${cpa_schema2_bin}" >> "${GITHUB_ENV}"
          echo "CPA_SCHEMA3_BIN=${PWD}/${cpa_schema3_bin}" >> "${GITHUB_ENV}"

      - name: Download and unpack schema-v2 and schema-v3 CPA releases on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CPA_SCHEMA2_ASSET: ${{ matrix.cpa_schema2_asset }}
          CPA_SCHEMA3_ASSET: ${{ matrix.cpa_schema3_asset }}
        run: |
          New-Item -ItemType Directory -Force cpa-schema2,cpa-schema3 | Out-Null
          gh release download $env:CPA_SCHEMA2_VERSION --repo router-for-me/CLIProxyAPI --pattern $env:CPA_SCHEMA2_ASSET --dir cpa-schema2
          gh release download $env:CPA_SCHEMA3_VERSION --repo router-for-me/CLIProxyAPI --pattern $env:CPA_SCHEMA3_ASSET --dir cpa-schema3
          Expand-Archive -Path (Join-Path cpa-schema2 $env:CPA_SCHEMA2_ASSET) -DestinationPath cpa-schema2/unpacked
          Expand-Archive -Path (Join-Path cpa-schema3 $env:CPA_SCHEMA3_ASSET) -DestinationPath cpa-schema3/unpacked
          $schema2Binary = Get-ChildItem cpa-schema2/unpacked -Recurse -File -Filter cli-proxy-api.exe | Select-Object -First 1
          $schema3Binary = Get-ChildItem cpa-schema3/unpacked -Recurse -File -Filter cli-proxy-api.exe | Select-Object -First 1
          if (-not $schema2Binary) { throw 'CPA v7.2.103 executable not found in release archive' }
          if (-not $schema3Binary) { throw 'CPA v7.2.129 executable not found in release archive' }
          Add-Content $env:GITHUB_ENV "CPA_SCHEMA2_BIN=$($schema2Binary.FullName)"
          Add-Content $env:GITHUB_ENV "CPA_SCHEMA3_BIN=$($schema3Binary.FullName)"

      - name: Verify official CPA Go toolchains
        shell: bash
        run: |
          verify_toolchain() {
            local version="$1"
            local binary="$2"
            local build_info
            build_info="$(go version -m "${binary}")"
            printf '%s\n' "${build_info}"
            if ! grep -Eq ': go1\.26\.4$' <<<"${build_info}"; then
              echo "official CPA ${version} was not built with Go 1.26.4" >&2
              exit 1
            fi
          }
          verify_toolchain "${CPA_SCHEMA2_VERSION}" "${CPA_SCHEMA2_BIN}"
          verify_toolchain "${CPA_SCHEMA3_VERSION}" "${CPA_SCHEMA3_BIN}"

      - name: CPA schema-v2 and schema-v3 load and registration smoke
        shell: bash
        run: |
          case "${GOOS}" in
            linux) extension=.so ;;
            darwin) extension=.dylib ;;
            windows) extension=.dll ;;
          esac
          for cpa_bin in "${CPA_SCHEMA2_BIN}" "${CPA_SCHEMA3_BIN}"; do
            go run ./cmd/cpa-load-smoke \
              -cpa "${cpa_bin}" \
              -plugin "dist/codex-pat-v${VERSION}${extension}" \
              -version "${VERSION}"
          done

      - name: Package native library
        shell: bash
        run: |
          case "${GOOS}" in
            linux) extension=.so ;;
            darwin) extension=.dylib ;;
            windows) extension=.dll ;;
          esac
          python scripts/release.py package \
            --version "${VERSION}" --goos "${GOOS}" --goarch "${GOARCH}" \
            --library "dist/codex-pat-v${VERSION}${extension}" --output release

      - uses: actions/upload-artifact@v4
        with:
          name: codex-pat-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/codex-pat_${{ inputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Validate complete release set
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          pattern: codex-pat-${{ inputs.version }}-*
          path: release
          merge-multiple: true

      - name: Generate and verify checksums
        run: |
          python3 scripts/release.py checksums --version "${VERSION}" --directory release
          python3 scripts/release.py verify-release --version "${VERSION}" --directory release

      - uses: actions/upload-artifact@v4
        with:
          name: codex-pat-${{ inputs.version }}-release
          path: |
            release/codex-pat_*.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: inputs.mode == 'publish'
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: codex-pat-${{ inputs.version }}-release
          path: release

      - name: Reject conflicting tag or release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists" >&2
            exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release v${VERSION} already exists" >&2
            exit 1
          fi
          python3 scripts/release.py verify-release --version "${VERSION}" --directory release

      - name: Create and validate draft release
        run: |
          gh release create "v${VERSION}" \
            release/codex-pat_*.zip release/checksums.txt \
            --target "${GITHUB_SHA}" --title "codex-pat v${VERSION}" \
            --notes "Compatibility: codex-pat v${VERSION} is built against the CLIProxyAPI v7.2.129 SDK, declares plugin RPC schema v2, and supports verified CPA host schemas v2-v3 (official v7.2.103 and v7.2.129). Host schema v1 and v4+ are rejected. codex-pat v0.1.5 is the final release targeting only CLIProxyAPI v7.2.103/schema v2; v0.1.4 is the final schema-v1 release for CLIProxyAPI v7.2.102." \
            --generate-notes --draft
          gh release view "v${VERSION}" --json isDraft,targetCommitish,assets > release/remote-release.json
          python3 -c 'import json, os, pathlib, sys; data=json.loads(pathlib.Path("release/remote-release.json").read_text()); version=os.environ["VERSION"]; expected={f"codex-pat_{version}_{goos}_{goarch}.zip" for goos, goarch in (("linux", "amd64"), ("linux", "arm64"), ("darwin", "arm64"), ("windows", "amd64"))} | {"checksums.txt"}; actual={asset["name"] for asset in data["assets"] if asset["size"] > 0}; valid=data["isDraft"] and data["targetCommitish"] == os.environ["GITHUB_SHA"] and actual == expected and len(data["assets"]) == 5; sys.exit(0 if valid else f"unexpected draft release: {data}")'

      - name: Publish validated release
        run: |
          gh release edit "v${VERSION}" --draft=false
          tag_sha="$(git ls-remote --tags origin "refs/tags/v${VERSION}" | awk '{print $1}')"
          test "${tag_sha}" = "${GITHUB_SHA}"
